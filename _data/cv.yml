    Projects:
      - name: Football Object Detection and Multi-Object Tracking
        url: https://github.com/mohammadKazzazi/Object_Detection_Deep_Learning
        summary: "Fine-tuned YOLOv8 on SportsMOT football video and built tracking with ByteTrack, DeepSORT, and CSRT, including occlusion and ID-switch analysis."
        highlights:
          - "mAP@50 0.947, mAP@50–95 0.779, precision 0.93, recall 0.94; 1.4 ms inference per frame on a P100 GPU."

      - name: Membership Inference Attacks Against Diffusion Models
        url: https://github.com/mohammadKazzazi/Membership-Inference-Attack-against-Diffusion-Models
        summary: "Re-implemented SecMI (ICML 2023) on CIFAR-100 DDPMs and proposed a hyperparameter-free multi-timestep fusion variant."
        highlights:
          - "Raised attack AUC from 0.971 to 0.984 and TPR@1% FPR from 0.519 to 0.642."

      - name: Machine Unlearning and Private Training
        url: https://github.com/mohammadKazzazi/Machine-Unlearning-and-Private-Training
        summary: "Implemented SISA sharded training with ResNet-18 on CIFAR-10 and verified unlearning with backdoor success rate and membership inference."

      - name: Hardware and Parallel Computing
        url: https://mohammadkazzazi.github.io/projects/hardware-systems/
        summary: "CORDIC and FFT on Zynq FPGA (Verilog, Vivado), a multi-cycle MIPS processor, parallel merge sort and heat-transfer simulation with texture memory in CUDA, and a digital telecommunication system simulation."

