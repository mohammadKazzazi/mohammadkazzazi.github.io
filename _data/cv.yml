cv:
  name: "Seyed Mohammad Ojagh Kazazi"
  headline: "M.Sc. Student in Electrical Engineering at EPFL"
  email: smohammadok@gmail.com
  location: "Lausanne, Switzerland"
  website: "https://mohammadkazzazi.github.io"

  sections:
    Summary:
      - "Electrical engineer and M.Sc. student at EPFL working on computer vision, vision-language models, and efficient on-device AI. My work spans research, teaching, and hardware-aware systems, with a focus on models that remain accurate under real memory, latency, and reliability constraints."

    Education:
      - institution: École Polytechnique Fédérale de Lausanne (EPFL)
        location: Lausanne, Switzerland
        area: Electrical Engineering
        degree: M.Sc.
        start_date: 2026-09
        end_date: present
        highlights:
          - "Fall 2026 coursework: Machine Learning, Mathematics of Data, Convex Optimization, Fundamentals of Inference and Learning."

      - institution: Sharif University of Technology
        location: Tehran, Iran
        area: Electrical Engineering (Digital Systems)
        degree: B.Sc.
        start_date: 2021-09
        end_date: 2025
        highlights:
          - "GPA: 18.53/20 (3.95/4)."
          - "Top 15% of the B.Sc. Electrical Engineering class and top 3 in Digital Systems."
          - "Selected graduate-level courses: Convex Optimization II (19.7), VLSI (19.1), Parallel Computing (18.4), Security in IoT (17.8), Deep Learning (17.2), Deep Generative Models (17.2)."
          - "Selected undergraduate courses: Linear Algebra / Mathematical Methods (20), Data Structures and Algorithms (19.5), Communication Systems (19), Introduction to Machine Learning (17.9), ASIC/FPGA System Design (17.2)."

    Experience:
      - company: Aalto University
        position: Research Assistant
        url: https://www.aalto.fi/en
        location: Espoo, Finland (remote)
        start_date: 2026-04
        end_date: present
        summary: "Supervisor: Prof. Siavash Khajavi."
        highlights:
          - "Developed a knowledge-distillation framework combining KL-divergence and cross-entropy supervision to compress a 7B Qwen2.5 vision-language teacher into 0.5B–3B student models."
          - "On DetectiumFire, the 0.5B student retained 95.2% of the teacher's burning-object accuracy with 14× fewer parameters and reached 99.5% fire/non-fire accuracy after deployment."
          - "Deployed and profiled distilled models on a Raspberry Pi 5 (4× Cortex-A76, 8 GB, CPU only): 1.9 GB peak memory, about 4 s end-to-end latency, and 2 false alarms on 1,452 test images."
          - "First-author submission to AAAI 2027 Innovative Applications of AI (IAAI)."
          - "Currently investigating prompt optimization and reasoning strategies for Vision-Language-Action models."

      - company: Raderon AI Laboratory
        position: Research Assistant
        location: British Columbia, Canada (remote)
        start_date: 2024-08
        end_date: 2025-01
        summary: "Supervisor: Dr. S. Sarabi."
        highlights:
          - "Conducted medical image analysis research combining the Discrete Wavelet Transform with swarm-based optimizers."
          - "Co-authored a paper published in Elsevier *Machine Learning with Applications*."

      - company: Artificial Creature Laboratory (ACLab), Sharif University of Technology
        position: Research Assistant
        location: Tehran, Iran
        start_date: 2024-07
        end_date: 2024-09
        summary: "Supervisor: Prof. Saeed Bagheri Shouraki."
        highlights:
          - "Designed and built a smart IoT socket for the lab's custom AI platform, with a path toward commercialization."
          - "Evaluated IoT platforms and network protocols, then implemented firmware on Arduino and ESP32/ESP8266."

